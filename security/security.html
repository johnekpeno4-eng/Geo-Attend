<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoAttend | Verification</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; --background:#f8f9ff; --surface:#fff; --panel:#eff4ff; --ink:#0b1c30; --muted:#45464d; --outline:#c6c6cd; --secondary:#0058be; }
    body { margin:0; min-height:100vh; background:var(--background); color:var(--ink); font-family:Inter,Arial,sans-serif; }
    .material-symbols-outlined { vertical-align:middle; font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24; }
    .field { width:100%; box-sizing:border-box; border:1px solid var(--outline); border-radius:14px; background:var(--panel); color:var(--ink); padding:14px 16px; }
    .message { border-radius:14px; padding:13px 15px; font-size:14px; font-weight:700; }
    .error { background:#ffdad6; color:#93000a; border:1px solid #ffb4ab; }
    .success { background:#dcfce7; color:#166534; border:1px solid #86efac; }
  </style>
</head>
<body data-role-required="student">
  <script src="../role-access.js?v=verification-page-1"></script>
  <main class="mx-auto flex min-h-screen w-full max-w-xl items-center px-4 py-8 sm:px-6">
    <section class="w-full rounded-3xl border border-[#c6c6cd] bg-white p-6 shadow-xl sm:p-9">
      <a class="inline-flex items-center gap-1 text-sm font-bold text-[#0058be] hover:underline" href="../student-profile.html"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Account settings</a>
      <div class="mt-8 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-[#eff4ff] text-[#0058be]"><span class="material-symbols-outlined text-4xl">fingerprint</span></div>
        <p class="mt-5 text-xs font-extrabold uppercase tracking-[.18em] text-[#0058be]">Account security</p>
        <h1 class="mt-2 text-3xl font-extrabold tracking-tight">VERIFICATION</h1>
        <p class="mx-auto mt-3 max-w-md text-sm leading-6 text-[#45464d]">Enroll this device to confirm your identity during attendance check-in.</p>
      </div>
      <div class="mt-8 rounded-2xl border border-[#c6c6cd] bg-[#f8f9ff] p-5">
        <div class="flex items-start gap-3"><span class="material-symbols-outlined text-3xl text-[#0058be]">phonelink_lock</span><div><h2 class="font-extrabold">Device security</h2><p class="mt-1 text-sm leading-5 text-[#45464d]">Use the fingerprint, Face ID, or screen lock already enabled on this device.</p></div></div>
        <p class="mt-4 break-all rounded-xl bg-white px-4 py-3 text-sm font-semibold text-[#45464d]" id="account">Loading account...</p>
        <button class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-black py-4 font-extrabold text-white disabled:cursor-wait disabled:opacity-60" id="biometric-button" type="button"><span class="material-symbols-outlined">fingerprint</span>Enable fingerprint</button>
        <button class="mt-3 hidden w-full rounded-xl border border-[#0058be] py-3 font-bold text-[#0058be]" id="remove-biometric" type="button">Remove device verification</button>
      </div>
      <p class="message mt-4 hidden" id="message" role="alert"></p>
    </section>
  </main>
  <script>
    (() => {
      const email = String(localStorage.getItem("geoAttendCurrentUser") || "").trim().toLowerCase();
      const accountNode = document.getElementById("account");
      const button = document.getElementById("biometric-button");
      const removeButton = document.getElementById("remove-biometric");
      const message = document.getElementById("message");
      accountNode.textContent = email || "No student account selected.";
      function show(text, type = "error") { message.textContent = text; message.className = `message mt-4 ${type}`; message.classList.remove("hidden"); }
      function bytes(value) { const text = String(value || ""); const padded = text.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(text.length / 4) * 4, "="); return Uint8Array.from(atob(padded), char => char.charCodeAt(0)); }
      function base64(value) { return btoa(String.fromCharCode(...new Uint8Array(value))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, ""); }
      function options(value) { return { ...value, challenge: bytes(value.challenge), user: { ...value.user, id: bytes(value.user.id) }, excludeCredentials: (value.excludeCredentials || []).map(item => ({ ...item, id: bytes(item.id) })) }; }
      function response(credential) { return { id: credential.id, rawId: base64(credential.rawId), type: credential.type, response: { clientDataJSON: base64(credential.response.clientDataJSON), attestationObject: base64(credential.response.attestationObject), transports: credential.response.getTransports?.() || [] }, clientExtensionResults: credential.getClientExtensionResults?.() || {} }; }
      async function post(url, body) { const result = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), cache:"no-store" }); const data = await result.json().catch(() => ({})); if (!result.ok) throw new Error(data.error || "Unable to complete verification."); return data; }
      async function refresh() { if (!email) return; try { const data = await fetch(`/api/webauthn/status?email=${encodeURIComponent(email)}`, { cache:"no-store" }).then(result => result.json()); const enabled = Boolean(data.enabled); button.disabled = enabled; button.textContent = enabled ? "Device verification enabled" : "Enable fingerprint"; removeButton.classList.toggle("hidden", !enabled); } catch {} }
      button.addEventListener("click", async () => { try { if (!window.isSecureContext || !navigator.credentials?.create) throw new Error("Open the HTTPS GeoAttend address, or use http://localhost:4800 on this computer."); if (!window.PublicKeyCredential) throw new Error("This browser does not support device verification."); button.disabled = true; button.textContent = "Waiting for device prompt..."; const data = await post("/api/webauthn/register-options", { email }); const pageHost = window.location.hostname.toLowerCase(); const serverHost = String(data.options?.rp?.id || pageHost).toLowerCase(); if (pageHost !== serverHost) throw new Error(`Open the same address in your browser. Page: ${pageHost}; server: ${serverHost}.`); const credential = await navigator.credentials.create({ publicKey: options(data.options) }); if (!credential) throw new Error("Verification was cancelled."); const verified = await post("/api/webauthn/register-verify", { email, response: response(credential) }); const profiles = JSON.parse(localStorage.getItem("geoAttendBiometricProfiles") || "{}"); profiles[email] = { ...(profiles[email] || {}), email, identityVerified:true, biometricVerified:true, webauthnCredential:verified.credential, enrolledAt:new Date().toISOString() }; localStorage.setItem("geoAttendBiometricProfiles", JSON.stringify(profiles)); show("Device verification enabled. Opening student home...", "success"); removeButton.classList.remove("hidden"); button.textContent = "Device verification enabled"; setTimeout(() => window.location.replace("student-home.html"), 700); } catch (error) { show(error.message || "Device verification failed."); button.disabled = false; button.textContent = "Enable fingerprint"; } });
      removeButton.addEventListener("click", async () => { try { await post("/api/webauthn/remove", { email }); removeButton.classList.add("hidden"); button.disabled = false; button.textContent = "Enable fingerprint"; show("Device verification removed.", "success"); } catch (error) { show(error.message); } });
      if (!email) { button.disabled = true; show("Your student session is missing. Sign in again."); } else refresh();
    })();
  </script>
</body>
</html>
