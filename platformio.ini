[platformio]
default_envs = esp12f

[env:esp12f]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

