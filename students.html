<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>GeoAttend | Students</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd",
            secondary: "#0058be",
            primary: "#000000",
            "on-primary": "#ffffff"
          },
          spacing: { xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "32px" },
          fontFamily: {
            "body-md": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "title-md": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "mono-data": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: Inter, sans-serif; }
    .material-symbols-outlined { display: inline-block; vertical-align: middle; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
  </style>
  <script src="role-access.js?v=20260924-loginfix" defer></script>
  <link rel="stylesheet" href="mobile-admin.css?v=20260924-adminside" />
</head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden" data-role-required="admin">
  <aside class="w-[280px] h-screen fixed left-0 top-0 bg-surface-container-lowest border-r border-outline-variant shadow-sm flex flex-col py-lg px-md z-50">
    <div class="flex items-center gap-md mb-xl px-sm">
      <div class="w-10 h-10 rounded-lg bg-secondary text-on-primary flex items-center justify-center">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">verified_user</span>
      </div>
      <div>
        <h1 class="text-3xl font-extrabold leading-tight">GeoAttend</h1>
        <p class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Student Registry</p>
      </div>
    </div>

    <nav class="flex-1 space-y-xs">
      <a class="flex items-center gap-md p-md rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" href="dashboard.html"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></a>
      <a class="flex items-center gap-md p-md rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" href="create-session.html"><span class="material-symbols-outlined">add_circle</span><span>Create Session</span></a>
      <a class="flex items-center gap-md p-md rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" href="live-monitor.html"><span class="material-symbols-outlined">security</span><span>Live Monitor</span></a>
      <a class="flex items-center gap-md p-md rounded-lg text-secondary font-bold border-l-4 border-secondary bg-surface-container-low transition-colors" href="students.html"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">groups</span><span>Students</span></a>
      <a class="flex items-center gap-md p-md rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" href="records.html"><span class="material-symbols-outlined">description</span><span>Records</span></a>
    </nav>

    <div class="mt-auto space-y-xs pt-lg border-t border-outline-variant">
      <a class="flex items-center gap-md p-md rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" href="#"><span class="material-symbols-outlined">logout</span><span>Logout</span></a>
    </div>
  </aside>

  <main class="ml-[280px] min-h-screen">
    <header class="flex justify-between items-center px-lg h-16 w-full bg-surface/80 backdrop-blur-md sticky top-0 z-40">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-secondary">Admin</p>
        <h2 class="text-2xl font-extrabold text-on-surface">Registered Students</h2>
      </div>
      <span class="font-mono-data text-secondary text-sm" id="student-count">0 students</span>
    </header>

    <div class="p-lg max-w-[1200px] mx-auto">
      <section class="bg-surface-container-lowest p-lg rounded-xl border border-outline-variant/30 shadow-sm mb-lg">
        <div class="grid gap-md md:grid-cols-[1fr_1fr_auto] md:items-end">
          <label class="block">
            <span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Active Session</span>
            <select class="mt-xs w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-md py-sm text-on-surface" id="session-select">
              <option value="">Loading live sessions...</option>
            </select>
          </label>
          <label class="block">
            <span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Search Student</span>
            <input class="mt-xs w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-md py-sm text-on-surface" id="student-search" placeholder="Name, email, or reg number" type="search" />
          </label>
          <button class="rounded-lg bg-secondary text-on-primary px-lg py-sm font-bold active:scale-95 transition-all" id="refresh-students" type="button">Refresh</button>
        </div>
        <p class="hidden mt-md rounded-lg bg-surface-container-low px-md py-sm text-sm font-bold text-secondary" id="students-message"></p>
      </section>

      <section class="bg-surface-container-lowest p-lg rounded-xl border border-outline-variant/30 shadow-sm">
        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full min-w-[1040px] text-left">
            <thead>
              <tr class="border-b border-outline-variant/40 text-xs font-bold uppercase tracking-widest text-on-surface-variant">
                <th class="pb-md pr-md">S/N</th>
                <th class="pb-md pr-md">Full Name</th>
                <th class="pb-md pr-md">Reg Number</th>
                <th class="pb-md pr-md">Email</th>
                <th class="pb-md pr-md">Department</th>
                <th class="pb-md pr-md">Level</th>
                <th class="pb-md pr-md text-right">Action</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-outline-variant/20" id="students-body">
              <tr><td class="py-lg text-center text-on-surface-variant" colspan="7">Loading students...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    let students = [];
    let sessions = [];

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showMessage(text, isError = false) {
      const message = document.getElementById("students-message");
      if (!message) return;
      message.textContent = text;
      message.classList.remove("hidden");
      message.classList.toggle("text-red-700", isError);
      message.classList.toggle("text-secondary", !isError);
    }

    function registrationSortValue(regNumber) {
      const matches = String(regNumber || "").match(/\d+/g);
      return matches ? Number(matches[matches.length - 1]) : Number.MAX_SAFE_INTEGER;
    }

    async function loadStudents() {
      try {
        const response = await fetch("/api/students", { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to load students.");
        students = Array.isArray(data.students) ? data.students : [];
        const localAccounts = JSON.parse(localStorage.getItem("geoAttendAccounts") || "[]").filter((account) => (account.role || "student") === "student");
        localAccounts.forEach((account) => {
          if (!students.some((student) => student.email === account.email)) students.push(account);
        });
        students.sort((a, b) => registrationSortValue(a.regNumber) - registrationSortValue(b.regNumber));
        renderStudents();
      } catch (error) {
        const localAccounts = JSON.parse(localStorage.getItem("geoAttendAccounts") || "[]").filter((account) => (account.role || "student") === "student");
        students = localAccounts.sort((a, b) => registrationSortValue(a.regNumber) - registrationSortValue(b.regNumber));
        renderStudents();
        showMessage(error.message || "Using local students only.", true);
      }
    }

    async function loadSessions() {
      const select = document.getElementById("session-select");
      try {
        const response = await fetch("/api/live-sessions", { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to load live sessions.");
        sessions = Array.isArray(data.sessions) ? data.sessions : [];
      } catch {
        sessions = JSON.parse(localStorage.getItem("geoAttendLiveSessions") || "[]").filter((session) => session.status === "active");
      }

      if (!sessions.length) {
        select.innerHTML = '<option value="">No active session</option>';
        return;
      }

      select.innerHTML = sessions.map((session) => `
        <option value="${escapeHtml(session.id)}">${escapeHtml(session.course || "Live class")} | ${escapeHtml(session.startTime || "--")} - ${escapeHtml(session.endTime || "--")}</option>
      `).join("");
    }

    function renderStudents() {
      const body = document.getElementById("students-body");
      const count = document.getElementById("student-count");
      const query = String(document.getElementById("student-search")?.value || "").trim().toLowerCase();
      const filtered = students.filter((student) => {
        const haystack = `${student.fullName || ""} ${student.regNumber || ""} ${student.email || ""}`.toLowerCase();
        return !query || haystack.includes(query);
      });
      if (count) count.textContent = `${filtered.length} ${filtered.length === 1 ? "student" : "students"}`;
      if (!filtered.length) {
        body.innerHTML = '<tr><td class="py-lg text-center text-on-surface-variant" colspan="7">No registered students found.</td></tr>';
        return;
      }
      body.innerHTML = filtered.map((student, index) => `
        <tr>
          <td class="py-md pr-md font-mono-data text-on-surface-variant">${index + 1}</td>
          <td class="py-md pr-md font-bold text-on-surface">${escapeHtml(student.fullName || "Unknown Student")}</td>
          <td class="py-md pr-md font-mono-data text-on-surface">${escapeHtml(student.regNumber || "--")}</td>
          <td class="py-md pr-md text-on-surface-variant">${escapeHtml(student.email || "--")}</td>
          <td class="py-md pr-md text-on-surface-variant">${escapeHtml(student.departmentName || "Department of Electrical/Electronics Engineering")}</td>
          <td class="py-md pr-md font-mono-data text-on-surface-variant">${escapeHtml(student.levelName || "100 Level")}</td>
          <td class="py-md pr-md text-right">
            <div class="flex justify-end gap-sm">
              <button class="rounded-lg bg-secondary text-on-primary px-md py-sm font-bold active:scale-95 transition-all" data-checkin-student="${escapeHtml(student.email)}" type="button">Check In</button>
              <button class="rounded-lg bg-red-600 text-white px-md py-sm font-bold active:scale-95 transition-all" data-delete-student="${escapeHtml(student.email)}" data-delete-reg="${escapeHtml(student.regNumber || "")}" type="button">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function getSessionStartDate(session) {
      if (!session?.startTime) return null;
      const [hours, minutes] = String(session.startTime).split(":").map(Number);
      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return null;
      const base = session.createdAt ? new Date(session.createdAt) : new Date();
      const start = new Date(base);
      start.setHours(hours, minutes, 0, 0);
      return start;
    }

    async function checkInStudent(email) {
      const sessionId = document.getElementById("session-select")?.value || "";
      const session = sessions.find((item) => item.id === sessionId);
      const student = students.find((item) => item.email === email);
      if (!session) {
        showMessage("Create or select an active session before checking in a student.", true);
        return;
      }
      if (!student) return;
      const start = getSessionStartDate(session);
      if (start && Date.now() < start.getTime()) {
        showMessage(`Check-in opens at ${start.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}.`, true);
        return;
      }
      const record = {
        email: student.email,
        fullName: student.fullName || student.email,
        regNumber: student.regNumber || "--",
        signature: student.fullName || student.email,
        attendeeRole: "student",
        assistedByAdmin: localStorage.getItem("geoAttendCurrentUser") || "admin",
        sessionId: session.id,
        course: session.course || "Live class",
        geofence: session.geofence || null,
        checkedInAt: new Date().toISOString(),
        status: "present",
        verificationMethod: "Admin assisted"
      };
      try {
        const response = await fetch("/api/attendance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(record)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to check in student.");
        localStorage.setItem("geoAttendAttendanceLog", JSON.stringify(Array.isArray(data.attendance) ? data.attendance : []));
        showMessage(`${student.fullName || student.email} checked in for ${session.course || "this session"}.`);
      } catch (error) {
        showMessage(error.message, true);
      }
    }


    async function deleteStudent(email, regNumber) {
      const student = students.find((item) => item.email === email || String(item.regNumber || "").toUpperCase() === String(regNumber || "").toUpperCase());
      if (!student) return;
      const label = `${student.fullName || student.email} (${student.regNumber || "no reg no"})`;
      const confirmed = window.confirm(`Delete ${label}? This removes the student account and biometric login from the database.`);
      if (!confirmed) return;
      const adminPassword = window.prompt("Enter your admin password to confirm deletion:");
      if (!adminPassword) {
        showMessage("Student deletion cancelled.", true);
        return;
      }
      try {
        const response = await fetch("/api/students/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            actorEmail: localStorage.getItem("geoAttendCurrentUser") || "",
            adminPassword,
            email,
            regNumber
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to delete student account.");
        students = Array.isArray(data.students) ? data.students : students.filter((item) => item.email !== email && String(item.regNumber || "").toUpperCase() !== String(regNumber || "").toUpperCase());
        const accounts = JSON.parse(localStorage.getItem("geoAttendAccounts") || "[]").filter((account) => account.email !== email && String(account.regNumber || "").toUpperCase() !== String(regNumber || "").toUpperCase());
        localStorage.setItem("geoAttendAccounts", JSON.stringify(accounts));
        localStorage.setItem("geoAttendRegisteredStudents", JSON.stringify(students));
        renderStudents();
        showMessage(`${label} deleted from the database.`);
      } catch (error) {
        showMessage(error.message, true);
      }
    }
    document.getElementById("student-search")?.addEventListener("input", renderStudents);
    document.getElementById("refresh-students")?.addEventListener("click", () => {
      loadSessions();
      loadStudents();
    });
    document.getElementById("students-body")?.addEventListener("click", (event) => {
      const checkinButton = event.target.closest("[data-checkin-student]");
      if (checkinButton) checkInStudent(checkinButton.dataset.checkinStudent);
      const deleteButton = event.target.closest("[data-delete-student]");
      if (deleteButton) deleteStudent(deleteButton.dataset.deleteStudent, deleteButton.dataset.deleteReg);
    });

    loadSessions();
    loadStudents();
  </script>
</body>
</html>
